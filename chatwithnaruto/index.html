<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naruto Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="avatar"></div>
                <div class="icons">
                    <span class="icon refresh">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M19 4H14V2H10V4H5C3.89543 4 3 4.89543 3 6V20C3 21.1046 3.89543 22 5 22H19C20.1046 22 21 21.1046 21 20V6C21 4.89543 20.1046 4 19 4ZM19 20H5V6H19V20ZM14 14H10V10H14V14Z" fill="#AEBAC1"/>
                        </svg>
                    </span>
                    <span class="icon chat">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 2H4C2.89543 2 2 2.89543 2 4V22L6 18H20C21.1046 18 22 17.1046 22 16V4C22 2.89543 21.1046 2 20 2ZM20 16H6L4 18V4H20V16Z" fill="#AEBAC1"/>
                        </svg>
                    </span>
                    <span class="icon menu">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 18H12.01" stroke="#AEBAC1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 12H12.01" stroke="#AEBAC1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 6H12.01" stroke="#AEBAC1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
            </div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Caută sau începe un chat nou">
            </div>
            <div class="chat-list" id="character-list"></div>
        </div>

        <div class="chat-window" id="chat-window">
            <div class="chat-header">
                <div class="chat-header-left">
                    <span class="back-btn" id="back-btn">←</span>
                    <img id="char-avatar" class="avatar" src="" alt="">
                    <div class="header-text">
                        <div class="chat-header-name" id="char-name"></div>
                        <div class="status">online <span class="online-dot"></span></div>
                    </div>
                </div>
                <div class="chat-header-right">
                    <a href="https://example.com/more-games" class="cta-button">More games</a>
                </div>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="message-input" placeholder="Scrie un mesaj">
                <button id="send-button">
                    <svg class="send-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
