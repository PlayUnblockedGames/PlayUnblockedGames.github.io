<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naruto Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="avatar"></div>
                <div class="icons">
                    <span class="icon refresh" id="refresh-btn" title="Clear current chat">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M19 4H14V2H10V4H5C3.89543 4 3 4.89543 3 6V20C3 21.1046 3.89543 22 5 22H19C20.1046 22 21 21.1046 21 20V6C21 4.89543 20.1046 4 19 4ZM19 20H5V6H19V20ZM14 14H10V10H14V14Z" fill="#AEBAC1"/>
                        </svg>
                    </span>
                    <span class="icon chat" id="new-chat-btn" title="New chat (reset view)">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 2H4C2.89543 2 2 2.89543 2 4V22L6 18H20C21.1046 18 22 17.1046 22 16V4C22 2.89543 21.1046 2 20 2ZM20 16H6L4 18V4H20V16Z" fill="#AEBAC1"/>
                        </svg>
                    </span>
                    <span class="icon menu" id="menu-btn" title="Settings">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 18H12.01" stroke="#AEBAC1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 12H12.01" stroke="#AEBAC1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 6H12.01" stroke="#AEBAC1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
            </div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Caută sau începe un chat nou">
            </div>
            <div class="chat-list" id="character-list"></div>
        </div>

        <div class="chat-window" id="chat-window">
            <div class="chat-header">
                <div class="chat-header-left">
                    <span class="back-btn" id="back-btn">←</span>
                    <img id="char-avatar" class="avatar" src="" alt="">
                    <div class="header-text">
                        <div class="chat-header-name" id="char-name"></div>
                        <div class="status">online <span class="online-dot"></span></div>
                    </div>
                </div>
                <div class="chat-header-right">
                    <a href="https://example.com/more-games" class="cta-button">More games</a>
                </div>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="message-input" placeholder="Scrie un mesaj">
                <div class="credits-badge" id="credits-badge" title="Messages remaining"></div>
                <button id="send-button">
                    <svg class="send-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="settings-backdrop" aria-hidden="true"></div>
    <div class="modal" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-hidden="true">
        <div class="modal-header">
            <div class="modal-title" id="settings-title">Settings</div>
            <button class="modal-close" id="settings-close" aria-label="Close">×</button>
        </div>
        <div class="modal-body">
            <label class="setting-row">
                <span class="setting-label">Family-friendly mode</span>
                <input type="checkbox" id="setting-family-friendly">
            </label>
            <label class="setting-row">
                <span class="setting-label">Realistic typing</span>
                <input type="checkbox" id="setting-realistic-typing" checked>
            </label>
            <label class="setting-row">
                <span class="setting-label">Typing speed</span>
                <select id="setting-typing-speed">
                    <option value="fast">Fast</option>
                    <option value="normal" selected>Normal</option>
                    <option value="slow">Slow</option>
                </select>
            </label>
            <div class="setting-actions">
                <button class="btn-secondary" id="clear-current-chat">Clear current chat</button>
                <button class="btn-danger" id="clear-all-chats">Clear ALL chats</button>
            </div>
            <div class="setting-note" id="rate-limit-note"></div>
        </div>
    </div>

    <div class="modal-backdrop" id="rewarded-backdrop" aria-hidden="true"></div>
    <div class="modal" id="rewarded-modal" role="dialog" aria-modal="true" aria-labelledby="rewarded-title" aria-hidden="true">
        <div class="modal-header">
            <div class="modal-title" id="rewarded-title">Charge SIM</div>
            <button class="modal-close" id="rewarded-close" aria-label="Close">×</button>
        </div>
        <div class="modal-body">
            <div class="rewarded-copy">
                You used all your messages. To get more, you need to charge your SIM by watching a rewarded ad.
            </div>
            <div class="rewarded-placeholder" id="rewarded-placeholder">
                Rewarded Ad (placeholder)
            </div>
            <div class="rewarded-actions">
                <button class="btn-secondary" id="rewarded-cancel">Not now</button>
                <button class="btn-primary" id="rewarded-watch">Watch ad (placeholder)</button>
            </div>
            <div class="setting-note" id="rewarded-status"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
